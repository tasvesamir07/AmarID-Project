name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amarid
          POSTGRES_PASSWORD: amarid
          POSTGRES_DB: amarid_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U amarid -d amarid_dev"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create .env with throwaway secrets
        run: node scripts/ensure-env.mjs
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests against the production build
        run: |
          npm run start -w @amarid/id &
          npx --yes wait-on http://localhost:3000/.well-known/openid-configuration --timeout 60000
          npm run test:e2e -w @amarid/id
