# Optional: PostgreSQL in Docker instead of the embedded one that `npm run dev`
# starts. Same port, user and database, so .env does not change.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amarid
      POSTGRES_PASSWORD: amarid
      POSTGRES_DB: amarid_dev
    ports:
      - "54329:5432"
    volumes:
      - amarid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amarid -d amarid_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  amarid-postgres:
