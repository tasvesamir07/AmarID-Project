services:
  # -----------------------------------------------------------
  # 1. Redis Cache Service
  # -----------------------------------------------------------
  - type: redis
    name: amarid-redis
    plan: free
    ipAllowList: []

  # -----------------------------------------------------------
  # 2. NestJS Backend API
  # -----------------------------------------------------------
  - type: web
    name: amarid-api
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && ./node_modules/.bin/tsc -p packages/shared/tsconfig.json && npm run build --workspace=apps/api && npx prisma db push --skip-generate
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: amarid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: amarid-redis
          property: connectionString
      - key: PEPPER_HEX
        value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - key: ENC_DEK_HEX
        value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - key: JWT_SECRET
        value: "amarid-jwt-secret-key-2024-production-use-only"
      - key: SESSION_SECRET
        value: "amarid-session-secret-key-2024-production-use-only"
      - key: CORS_ORIGINS
        value: "https://amarid-web.onrender.com"

  # -----------------------------------------------------------
  # 3. Next.js Frontend Web App
  # -----------------------------------------------------------
  - type: web
    name: amarid-web
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && ./node_modules/.bin/tsc -p packages/shared/tsconfig.json && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://amarid-api.onrender.com

databases:
  # Free PostgreSQL on Render
  - name: amarid-db
    plan: free
    databaseName: amarid
    user: amarid
