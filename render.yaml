services:
  # -----------------------------------------------------------
  # 1. NestJS Backend API
  # -----------------------------------------------------------
  - type: web
    name: amarid-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx tsc -p packages/shared/tsconfig.json && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: amarid-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: amarid-redis
          property: connectionString
      - key: PEPPER_HEX
        generateValue: true
      - key: ENC_DEK_HEX
        generateValue: true

  # -----------------------------------------------------------
  # 2. Next.js Frontend Web App
  # -----------------------------------------------------------
  - type: web
    name: amarid-web
    env: node
    plan: free
    buildCommand: npm install && npx tsc -p packages/shared/tsconfig.json && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: amarid-api
          property: host

databases:
  # Free PostgreSQL on Render
  - name: amarid-db
    plan: free
    databaseName: amarid
    user: amarid

  # Free Redis on Render
  - name: amarid-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
