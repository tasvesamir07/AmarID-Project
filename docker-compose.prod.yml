version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amarid-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amarid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amarid_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-amarid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amarid} -d ${POSTGRES_DB:-amarid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amarid-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: amarid-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-amarid}:${POSTGRES_PASSWORD:-amarid_secure_password_2026}@postgres:5432/${POSTGRES_DB:-amarid}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_URL: ${PUBLIC_DOMAIN:-http://localhost:3000}
      API_URL: ${PUBLIC_API_DOMAIN:-http://localhost:4000}
      PEPPER_HEX: ${PEPPER_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ENC_DEK_HEX: ${ENC_DEK_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: amarid-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
